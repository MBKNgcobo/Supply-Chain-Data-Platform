[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supply-chain-data-platform"
version = "0.1.0"
description = "CSV-to-Bronze ingestion pipeline for the Supply Chain Data Platform."
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2",
    "psycopg2-binary",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.8",
    "dbt-core>=1.8",
    "dbt-postgres>=1.8",
    "pyyaml>=6",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# E: pycodestyle errors, F: pyflakes, I: import order, UP: pyupgrade.
# Deliberately narrow: the codebase predates linting, so broader rule sets
# (BLE, DTZ, TRY, S, RUF) would gate on pre-existing style, not on quality.
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.ruff.format]
# line-length lives under [tool.ruff] and is shared by lint + format.

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--cov=supply_chain_pipeline --cov-report=term-missing -m \"not integration\""
markers = [
    "integration: end-to-end pipeline tests against a real PostgreSQL database (docs/testing/integration-test-plan.md; ADR-006). Opt in with: python -m pytest -m integration",
]

