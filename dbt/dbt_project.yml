# dbt project for the Supply Chain Data Platform.
#
# LAYERING DECISION (see docs/decisions/ADR-001-staging-layering.md)
#   bronze  = raw, TEXT, appended        (Postgres, written by the Python loader)
#   silver  = typed, de-duplicated       (dbt staging + intermediate)
#   gold    = published, business-facing (dbt marts, what Power BI reads)
#
# The +schema values below place each dbt layer in the schema that already exists
# per sql/bootstrap/001_create_schemas.sql.

name: supply_chain_data_platform
version: 1.0.0
config-version: 2

profile: supply_chain

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  supply_chain_data_platform:
    +materialized: view

    staging:
      +materialized: view
      +schema: silver
      +tags: ["staging", "silver"]

    intermediate:
      +materialized: view
      +schema: silver
      +tags: ["intermediate", "silver"]

    marts:
      +materialized: table
      +schema: gold
      +tags: ["marts", "gold"]

